<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全銀フォーマット変換ツール</title>
    <!-- SheetJS (Excel読み込み用ライブラリ) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        h1 {
            font-size: 24px;
            margin-top: 0;
            color: #0f172a;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 15px;
        }

        .upload-section {
            border: 2px dashed var(--border-color);
            padding: 30px;
            text-align: center;
            border-radius: 8px;
            background: #f1f5f9;
            margin-bottom: 25px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .upload-section:hover {
            background: #e2e8f0;
        }

        input[type="file"] {
            display: none;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .summary {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            background: #f8fafc;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
        }

        .summary-item {
            font-size: 14px;
        }

        .summary-item span {
            font-weight: bold;
            font-size: 16px;
            color: var(--primary-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
            font-size: 14px;
        }

        th,
        td {
            border: 1px solid #e2e8f0;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #f1f5f9;
            font-weight: 600;
        }

        .table-container {
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .actions {
            text-align: right;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>全銀フォーマット変換ツール</h1>
        <p>Excel（.xlsx）またはCSVファイルを選択し、全銀フォーマット（固定長120バイト）のテキストに変換します。</p>

        <!-- ファイルアップロード -->
        <div class="upload-section" onclick="document.getElementById('fileInput').click()">
            <p style="margin: 0 0 10px 0; font-weight: bold;">ファイルをドラッグ＆ドロップ、またはクリックして選択</p>
            <p style="margin: 0; color: #64748b; font-size: 13px;">対応形式: .xlsx, .csv</p>
            <input type="file" id="fileInput" accept=".xlsx, .csv">
        </div>

        <div id="resultArea" style="display: none;">
            <div class="summary">
                <div class="summary-item">読込件数: <span id="countText">0</span> 件</div>
                <div class="summary-item">合計金額: <span id="amountText">0</span> 円</div>
            </div>

            <h3>プレビュー</h3>
            <div class="table-container">
                <table id="previewTable">
                    <thead>
                        <tr>
                            <th>行</th>
                            <th>銀行コード</th>
                            <th>支店コード</th>
                            <th>口座種別</th>
                            <th>口座番号</th>
                            <th>受取人名</th>
                            <th>金額</th>
                        </tr>
                    </thead>
                    <tbody id="previewBody">
                        <!-- データ挿入部 -->
                    </tbody>
                </table>
            </div>

            <div class="actions">
                <button class="btn" id="downloadBtn" onclick="downloadZenginFile()">全銀データをダウンロード (.txt)</button>
            </div>
        </div>
    </div>

    <script>
        let parsedData = [];

        document.getElementById('fileInput').addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            const fileName = file.name.toLowerCase();

            if (fileName.endsWith('.xlsx') || fileName.endsWith('.xls')) {
                reader.onload = function (e) {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                    processData(json);
                };
                reader.readAsArrayBuffer(file);
            } else if (fileName.endsWith('.csv')) {
                reader.onload = function (e) {
                    const text = e.target.result;
                    // 簡易CSVパース
                    const rows = text.split(/\r\n|\n/).map(row => {
                        return row.split(',').map(val => val.replace(/^["'](.*)["']$/, '$1').trim());
                    }).filter(row => row.length > 1 && row[0] !== "");
                    processData(rows);
                };
                reader.readAsText(file, 'shift-jis'); // または utf-8
            } else {
                alert('対応していないファイル形式です。');
            }
        });

        function processData(rows) {
            // ヘッダー行をスキップしてデータを抽出（1行目がタイトルの想定）
            parsedData = [];
            let totalAmount = 0;

            // 1行目をヘッダーとして2行目から読み込み
            for (let i = 1; i < rows.length; i++) {
                const r = rows[i];
                if (!r || r.length < 6 || !r[0]) continue;

                const item = {
                    bankCode: String(r[0]).padStart(4, '0'),
                    branchCode: String(r[1]).padStart(3, '0'),
                    accountType: String(r[2]), // 1:普通, 2:当座 etc
                    accountNumber: String(r[3]).padStart(7, '0'),
                    accountName: String(r[4]),
                    amount: parseInt(r[5], 10) || 0
                };
                totalAmount += item.amount;
                parsedData.push(item);
            }

            if (parsedData.length === 0) {
                alert('有効なデータが見つかりませんでした。');
                return;
            }

            // プレビュー描画
            const tbody = document.getElementById('previewBody');
            tbody.innerHTML = '';
            parsedData.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
            <td>${index + 1}</td>
            <td>${item.bankCode}</td>
            <td>${item.branchCode}</td>
            <td>${item.accountType}</td>
            <td>${item.accountNumber}</td>
            <td>${item.accountName}</td>
            <td>${item.amount.toLocaleString()} 円</td>
        `;
                tbody.appendChild(tr);
            });

            document.getElementById('countText').textContent = parsedData.length;
            document.getElementById('amountText').textContent = totalAmount.toLocaleString();
            document.getElementById('resultArea').style.display = 'block';
        }

        // 全銀フォーマットの生成とダウンロード
        function downloadZenginFile() {
            if (parsedData.length === 0) return;

            let lines = [];
            let totalCount = parsedData.length;
            let totalAmount = parsedData.reduce((sum, item) => sum + item.amount, 0);

            // 1. ヘッダレコード (1型) - 固定長120バイト
            // ※ 実際の運用に合わせてコードや日付を調整してください
            let header = "1"; // 種別コード
            header += "21"; // 区分コード（総合振込：21）
            header += "0";  // コード区分
            header += "1234"; // 委託者コード
            header += "サンプルガイシャ".padEnd(40, ' '); // 委託者名
            header += "0101"; // 振込日 (MMDD)
            header += "0123"; // 振込先金融機関番号
            header += "ヤマダ"; // 振込先金融機関名
            header += "001";  // 振込先支店番号
            header += "ホンテン"; // 振込先支店名
            header += "1";  // 預金種目
            header += "1234567"; // 口座番号
            header += "          "; // ダミー等
            lines.push(padTo120(header));

            // 2. データレコード (2型)
            parsedData.forEach(item => {
                let data = "2";
                data += item.bankCode;
                data += "    "; // 金融機関名（省略可）
                data += item.branchCode;
                data += "   "; // 支店名（省略可）
                data += "          "; // 手形交換所番号等
                data += item.accountType;
                data += item.accountNumber;
                data += toHankakuKana(item.accountName).padEnd(30, ' ');
                data += String(item.amount).padStart(10, '0');
                data += "1"; // 新法区分
                data += "                  "; // 顧客コード等
                data += "0"; // 識別表示
                lines.push(padTo120(data));
            });

            // 3. トレーラレコード (8型)
            let trailer = "8";
            trailer += String(totalCount).padStart(6, '0');
            trailer += String(totalAmount).padStart(12, '0');
            trailer += "".padEnd(101, ' ');
            lines.push(padTo120(trailer));

            // 4. エンドレコード (9型)
            let end = "9";
            end += "".padEnd(119, ' ');
            lines.push(padTo120(end));

            // テキストファイルとしてダウンロード
            const blob = new Blob([lines.join('\r\n')], { type: 'text/plain;charset=Shift_JIS' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'ZENGIN.txt';
            a.click();
            URL.revokeObjectURL(url);
        }

        // 120バイト（半角文字数ベース）にパディング・調整する関数
        function padTo120(str) {
            // 簡易的に文字数で120文字に調整
            if (str.length > 120) {
                return str.substring(0, 120);
            }
            return str.padEnd(120, ' ');
        }

        // 簡易カナ変換（必要に応じて調整）
        function toHankakuKana(str) {
            if (!str) return '';
            // 全角カタカナを半角カタカナに変換する簡易処理（英数字・漢字はそのまま）
            const kanaMap = {
                'ア': 'ｱ', 'イ': 'ｲ', 'ウ': 'ｳ', 'エ': 'ｴ', 'オ': 'ｵ', 'カ': 'ｶ', 'キ': 'ｷ', 'ク': 'ｸ', 'ケ': 'ｹ', 'コ': 'ｺ',
                'サ': 'ｻ', 'シ': 'ｼ', 'ス': 'ｽ', 'セ': 'ｾ', 'ソ': 'ｿ', 'タ': 'ﾀ', 'チ': 'ﾁ', 'ツ': 'ﾂ', 'テ': 'ﾃ', 'ト': 'ﾄ',
                'ナ': 'ﾅ', 'ニ': 'ﾆ', 'ヌ': 'ﾇ', 'ネ': 'ﾈ', 'ノ': 'ﾉ', 'ハ': 'ﾊ', 'ヒ': 'ﾋ', 'フ': 'ﾌ', 'ヘ': 'ﾍ', 'ホ': 'ﾎ',
                'マ': 'ﾏ', 'ミ': 'ﾐ', 'ム': 'ﾑ', 'メ': 'ﾒ', 'モ': 'ﾓ', 'ヤ': 'ﾔ', 'ユ': 'ﾕ', 'ヨ': 'ﾖ',
                'ラ': 'ﾗ', 'リ': 'ﾘ', 'ル': 'ﾙ', 'レ': 'ﾚ', 'ロ': 'ﾛ', 'ワ': 'ﾜ', 'ヲ': 'ｦ', 'ン': 'ﾝ',
                'ァ': 'ｧ', 'ィ': 'ｨ', 'ゥ': 'ｩ', 'ェ': 'ｪ', 'ォ': 'ォ', 'ッ': 'ｯ', 'ャ': 'ｬ', 'ュ': 'ｭ', 'ョ': 'ｮ',
                'ー': 'ｰ', 'ﾞ': 'ﾞ', 'ﾟ': 'ﾟ', '、': '､', '。': '｡', '「': '「', '」': '」', '・': '･'
            };
            return str.split('').map(char => kanaMap[char] || char).join('');
        }
    </script>

</body>

</html>
